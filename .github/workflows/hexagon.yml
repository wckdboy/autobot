# Builds llama.cpp's Hexagon NPU backend (libggml-hexagon.so + the HTP DSP libraries) for the
# pinned llama.cpp submodule. The Hexagon SDK only runs on Linux x86-64 (or Windows on Arm), so
# the libraries are built here and published as a release the Android build downloads.
name: hexagon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hexagon.yml
      - third_party/llama.cpp

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned llama.cpp
        id: pin
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama
          git -C llama checkout "$commit"

      - name: Configure
        shell: bash
        run: |
          env | grep -E 'HEXAGON|ANDROID|NDK' || true
          ndk="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-/opt/android-ndk-r28b}}"
          sdk="${HEXAGON_SDK_ROOT:-$(ls -d /opt/hexagon/6.* | sort -V | tail -1)}"
          cmake -S llama -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DGGML_CPU_KLEIDIAI=OFF \
            -DGGML_OPENCL=OFF -DGGML_HEXAGON=ON -DHEXAGON_SDK_ROOT="$sdk" -DPREBUILT_LIB_DIR=android_aarch64 \
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF

      - name: Build
        shell: bash
        run: cmake --build build --target ggml-hexagon htp-v73 htp-v75 htp-v79 htp-v81 -j"$(nproc)"

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -name 'libggml-hexagon.so' -exec cp {} out/ \;
          find build -name 'libggml-htp-v*.so' -exec cp {} out/ \;
          ndk="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-/opt/android-ndk-r28b}}"
          strip="$(ls "$ndk"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          "$strip" --strip-unneeded out/libggml-hexagon.so
          ls -la out
          (cd out && sha256sum *.so > SHA256SUMS)
          cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hexagon-libs
          path: out/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hexagon-libs
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          tag="hexagon-${COMMIT:0:12}"
          (cd out && zip -q ../hexagon-libs.zip *.so SHA256SUMS)
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release create "$tag" hexagon-libs.zip out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Hexagon NPU libraries for llama.cpp ${COMMIT:0:12}" \
            --notes "Built by .github/workflows/hexagon.yml from llama.cpp ${COMMIT} with the public snapdragon-toolchain image. Consumed by the Android build; not an app release."
