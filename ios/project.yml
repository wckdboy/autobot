# XcodeGen spec for the Autobot iOS app. Generate the project with `xcodegen generate` (in ios/).
# The .xcodeproj is not committed. See ios/README.md.
name: Autobot

options:
  bundleIdPrefix: ai.wckd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  # On-device engines (llama.cpp on Metal, whisper.cpp, Core ML Stable Diffusion). Its native
  # xcframeworks must exist before Xcode resolves it: scripts/bootstrap-engines.sh (once).
  AutobotEngines:
    path: Packages/AutobotEngines

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XKA8CGC2AB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.6.2"
    CURRENT_PROJECT_VERSION: "14"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The native engines and the Kotlin framework ship arm64 simulator slices only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  Autobot:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      # Fonts are referenced from the Android design system (single source, not copied).
      - path: ../core/designsystem/src/main/res/font/antonio.ttf
        group: App/Resources/Fonts
        buildPhase: resources
      - path: ../core/designsystem/src/main/res/font/jetbrains_mono.ttf
        group: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: AutobotEngines
        product: AutobotEngines
      # The shared Kotlin agent runtime (`:shared`), linked statically. The scheme pre-action
      # builds it with Gradle for the active configuration (Release → release framework).
      - framework: Frameworks/AutobotShared.xcframework
        embed: false
        link: true
      # System entry points (ROADMAP Phase 2.5 item 8): share sheet, widgets and the control.
      - target: AutobotShare
      - target: AutobotWidgets
    preBuildScripts:
      - name: Verify AutobotShared
        basedOnDependencyAnalysis: false
        script: |
          [ "${AUTOBOT_SKIP_SHARED_BUILD:-}" = "1" ] && exit 0
          status="$(cat "$PROJECT_DIR/Frameworks/build-shared.status" 2>/dev/null || echo missing)"
          if [ "$status" != "ok $CONFIGURATION" ]; then
            echo "error: the Kotlin :shared build did not succeed for $CONFIGURATION ($status). See ios/Frameworks/build-shared.log, or set AUTOBOT_SKIP_SHARED_BUILD=1 to link the existing framework."
            tail -20 "$PROJECT_DIR/Frameworks/build-shared.log" 2>/dev/null || true
            exit 1
          fi
    entitlements:
      path: App/Autobot.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        # Image and chat models need more than the default per-app memory limit.
        com.apple.developer.kernel.increased-memory-limit: true
        # Share extension → app hand-off (SharedInbox).
        com.apple.security.application-groups:
          - group.ai.wckd.autobot
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Autobot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # autobot:// links from the widgets, the control and the share extension (EntryLink).
        CFBundleURLTypes:
          - CFBundleURLName: ai.wckd.autobot
            CFBundleURLSchemes:
              - autobot
        UIAppFonts:
          - antonio.ttf
          - jetbrains_mono.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock Autobot with Face ID. Your conversations are encrypted on this device.
        NSMicrophoneUsageDescription: Dictation is transcribed on this phone. Audio is never stored or sent anywhere.
        NSPhotoLibraryAddUsageDescription: Export saves an unencrypted copy of an image you choose to your photo library.
        NSLocalNetworkUsageDescription: Reach image backends and model servers you configure on your own network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.autobot
        PRODUCT_NAME: Autobot
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Apple Intelligence (iOS 26+) is optional: iOS 18–25 launch without FoundationModels.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]

  # "Autobot" in the share sheet: hands text, links and images to the app via the App Group.
  AutobotShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Also in the app (App/Entry), the reader side.
      - path: App/Entry/SharedInbox.swift
    entitlements:
      path: ShareExtension/AutobotShare.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.security.application-groups:
          - group.ai.wckd.autobot
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Autobot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.autobot.share
        PRODUCT_NAME: AutobotShare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  # Launcher widget, lock screen voice widget and the Control Center voice control. Static: they
  # never show anything from a conversation.
  AutobotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Autobot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.autobot.widgets
        PRODUCT_NAME: AutobotWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  AutobotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Cross-platform proof: an export written by the Kotlin code, decrypted by the Swift crypto.
      - path: ../shared/backup/testvector.autobot
        buildPhase: resources
    dependencies:
      - target: Autobot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wckd.autobot.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Autobot:
    build:
      preActions:
        - name: Build engine frameworks (if missing) and AutobotShared
          settingsTarget: Autobot
          script: |
            mkdir -p "$PROJECT_DIR/Frameworks"
            "$PROJECT_DIR/scripts/bootstrap-engines.sh" > "$PROJECT_DIR/Frameworks/bootstrap-engines.log" 2>&1 || true
            # Pre-actions cannot fail a build; the target's "Verify AutobotShared" phase does,
            # from the status written here.
            if "$PROJECT_DIR/scripts/build-shared.sh" "$CONFIGURATION" > "$PROJECT_DIR/Frameworks/build-shared.log" 2>&1; then
              echo "ok $CONFIGURATION" > "$PROJECT_DIR/Frameworks/build-shared.status"
            else
              echo "failed $CONFIGURATION" > "$PROJECT_DIR/Frameworks/build-shared.status"
            fi
      targets:
        Autobot: all
        AutobotTests: [test]
    test:
      config: Debug
      targets:
        - AutobotTests
    run:
      config: Debug
    archive:
      config: Release
